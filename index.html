<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Natilla 💙</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, sans-serif;
  text-align: center;
  color: white;
}

/* VIDEO DE FONDO */
#bgvideo {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  object-fit: cover;
  z-index: -2;
}

/* OSCURECER VIDEO */
.overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(0,0,0,0.35);
  z-index: -1;
}

h1 {
  margin: 20px 0;
}

.galeria {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
  padding: 15px;
}

.galeria img {
  width: 100%;
  border-radius: 18px;
  box-shadow: 0 6px 14px rgba(0,0,0,0.5);
}

.pregunta {
  font-size: 22px;
  margin: 20px;
}

.botones {
  position: relative;
  height: 140px;
}

button {
  padding: 16px 28px;
  font-size: 18px;
  border: none;
  border-radius: 40px;
  cursor: pointer;
}

#si {
  background: #63b3ed;
  color: white;
  transition: transform 0.3s ease;
}

#no {
  background: #a0aec0;
  color: white;
  position: absolute;
  right: 20%;
}

.mensaje-final {
  display: none;
  padding: 25px;
  font-size: 18px;
  line-height: 1.5;
}

.heart {
  position: fixed;
  bottom: -20px;
  font-size: 22px;
  animation: subir 4s linear forwards;
}

@keyframes subir {
  from { transform: translateY(0); opacity: 1; }
  to { transform: translateY(-100vh); opacity: 0; }
}
</style>
</head>

<body>

<!-- VIDEO -->
<video id="bgvideo" autoplay muted loop playsinline>
  <source src="./video.mp4" type="video/mp4">
</video>

<div class="overlay"></div>

<h1>Natilla 💙</h1>

<div class="galeria">
  <img src="./nos1.jpg">
  <img src="./nos2.jpg">
  <img src="./nos3.jpg">
  <img src="./nos4.jpg">
  <img src="./nos5.jpg">
  <img src="./nos6.jpg">
  <img src="./pochacco1.jpg">
  <img src="./pochacco2.jpg">
  <img src="./pochacco3.jpg">
  <img src="./pochacco4.jpg">
  <img src="./pochacco5.jpg">
</div>

<div class="pregunta" id="texto">
  Gordita hermosa… ¿quieres ser mi San Valentín? 💙✨
</div>

<div class="botones">
  <button id="si" onclick="aceptar()">SÍ 💙</button>
  <button id="no" onmouseover="moverNo()">NO 😅</button>
</div>

<div class="mensaje-final" id="final">
  💙✨<br><br>
  Te amo con todo mi corazón.<br>
  Gracias por tanto, cuenta siempre conmigo.<br>
  Hoy, este mes y siempre.
</div>

<script>
let escala = 1;
let frases = [
  "di que sí xfiii 🥺💙",
  "amoooorrr 💕",
  "say yes yes ✨",
  "gordita hermosa 🥰",
  "te regalo un abrazo 🤍"
];
let i = 0;

function moverNo() {
  const no = document.getElementById("no");
  no.style.top = Math.random() * 90 + "px";
  no.style.left = Math.random() * 90 + "px";

  document.getElementById("texto").innerText = frases[i % frases.length];
  i++;

  escala += 0.18;
  document.getElementById("si").style.transform = `scale(${escala})`;
}

function aceptar() {
  document.querySelector(".galeria").style.display = "none";
  document.querySelector(".botones").style.display = "none";
  document.getElementById("texto").style.display = "none";
  document.getElementById("final").style.display = "block";

  setInterval(() => {
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.innerText = ["💗","💖","✨","🌸"][Math.floor(Math.random()*4)];
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }, 350);
}
</script>

</body>
</html>
