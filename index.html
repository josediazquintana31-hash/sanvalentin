<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Natilla 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #bfe9ff, #e6f7ff);
      text-align: center;
    }

    h1 {
      color: #2b6cb0;
      margin: 20px 0;
    }

    .music-btn {
      background: #2b6cb0;
      color: white;
      border: none;
      border-radius: 30px;
      padding: 14px 26px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 15px;
    }

    .galeria img {
      width: 100%;
      border-radius: 14px;
    }

    .pregunta {
      font-size: 22px;
      margin: 20px;
      color: #1a365d;
    }

    .botones {
      position: relative;
      height: 140px;
    }

    button {
      padding: 14px 26px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #si {
      background: #63b3ed;
      color: white;
      transition: transform 0.3s;
    }

    #no {
      background: #a0aec0;
      color: white;
      position: absolute;
      right: 20%;
    }

    #final {
      display: none;
      padding: 25px;
      font-size: 18px;
      color: #2b6cb0;
    }
  </style>
</head>

<body>

  <h1>Natilla 💙</h1>

  <!-- BOTÓN DE MÚSICA -->
  <button class="music-btn" onclick="playMusic()">▶ Reproducir música</button>

  <!-- AUDIO -->
  <audio id="music">
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <div class="galeria">
    <img src="nos1.jpg">
    <img src="nos2.jpg">
    <img src="nos3.jpg">
    <img src="nos4.jpg">
    <img src="nos5.jpg">
    <img src="nos6.jpg">
    <img src="pochacco1.jpg">
    <img src="pochacco2.jpg">
    <img src="pochacco3.jpg">
    <img src="pochacco4.jpg">
    <img src="pochacco5.jpg">
  </div>

  <div class="pregunta">
    ¿Gordita hermosa, quieres ser mi San Valentín? 💙✨
  </div>

  <div class="botones">
    <button id="si" onclick="aceptar()">SÍ 💙</button>
    <button id="no" onmouseover="moverNo()">NO 😅</button>
  </div>

  <div id="final">
    💙✨<br><br>
    Te amo con todo mi corazón.<br>
    Gracias por tanto, cuenta siempre conmigo.<br>
    Este mes es especial… como todos los meses a tu lado.
    <br><br>💙✨
  </div>

  <script>
    let escala = 1;
    let frases = [
      "di que sí xfiii 🥺",
      "amoooorrr 💙",
      "say yes yes 😘",
      "gordita hermosa 💕",
      "te regalo un abrazo si dices que sí 🤍"
    ];
    let i = 0;

    function moverNo() {
      const no = document.getElementById("no");
      no.style.top = Math.random() * 90 + "px";
      no.style.left = Math.random() * 90 + "px";

      document.querySelector(".pregunta").innerText = frases[i % frases.length];
      i++;

      escala += 0.15;
      document.getElementById("si").style.transform = "scale(" + escala + ")";
    }

    function aceptar() {
      document.querySelector(".galeria").style.display = "none";
      document.querySelector(".botones").style.display = "none";
      document.querySelector(".pregunta").style.display = "none";
      document.getElementById("final").style.display = "block";
    }

    function playMusic() {
      const audio = document.getElementById("music");
      audio.play();
    }
  </script>

</body>
</html>
