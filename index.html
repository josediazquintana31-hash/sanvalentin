<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Natilla 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #bfe9ff, #e6f7ff);
      text-align: center;
    }

    h1 {
      color: #2b6cb0;
      margin: 20px 10px;
    }

    video {
      width: 95%;
      max-width: 500px;
      border-radius: 18px;
      margin: 10px auto 20px;
      display: block;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }

    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      padding: 15px;
    }

    .galeria img {
      width: 100%;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.15);
    }

    .pregunta {
      font-size: 22px;
      margin: 20px;
      color: #1a365d;
      font-weight: bold;
    }

    .botones {
      position: relative;
      height: 140px;
    }

    button {
      padding: 15px 25px;
      font-size: 18px;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #si {
      background: #63b3ed;
      color: white;
      transition: transform 0.3s;
    }

    #no {
      background: #a0aec0;
      color: white;
      position: absolute;
      top: 60px;
      left: 50%;
      transform: translateX(-50%);
    }

    .mensaje-final {
      display: none;
      padding: 25px;
      font-size: 18px;
      color: #2b6cb0;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <h1>Natilla 💙</h1>

  <!-- VIDEO -->
  <video autoplay loop muted playsinline>
    <source src="video.mp4" type="video/mp4">
    Tu navegador no soporta video.
  </video>

  <!-- GALERÍA -->
  <div class="galeria">
    <img src="fotos/nos1.jpg">
    <img src="fotos/nos2.jpg">
    <img src="fotos/nos3.jpg">
    <img src="fotos/nos4.jpg">
    <img src="fotos/nos5.jpg">
    <img src="fotos/nos6.jpg">
    <img src="fotos/pochacco1.jpg">
    <img src="fotos/pochacco2.jpg">
    <img src="fotos/pochacco3.jpg">
    <img src="fotos/pochacco4.jpg">
    <img src="fotos/pochacco5.jpg">
  </div>

  <div class="pregunta">
    ¿Gordita hermosa, quieres ser mi San Valentín? 💙✨
  </div>

  <div class="botones">
    <button id="si" onclick="aceptar()">SÍ 💙</button>
    <button id="no" onmouseover="moverNo()">NO 😅</button>
  </div>

  <div class="mensaje-final" id="final">
    💙✨<br><br>
    Te amo con todo mi corazón.<br>
    Gracias por tanto, cuenta siempre conmigo.<br>
    Este mes es especial,<br>
    como todos los meses a tu lado.<br><br>
    💙✨
  </div>

  <script>
    let escala = 1;
    let frases = [
      "di que sí xfiii 🥺",
      "amoooorrr 💙",
      "say yes yes 😘",
      "gordita hermosa 💕",
      "te regalo un abrazo si dices que sí 🤍"
    ];
    let i = 0;

    function moverNo() {
      const no = document.getElementById("no");
      no.style.top = Math.random() * 80 + "px";
      no.style.left = Math.random() * 80 + "px";

      document.querySelector(".pregunta").innerText =
        frases[i % frases.length];
      i++;

      escala += 0.15;
      document.getElementById("si").style.transform =
        `scale(${escala})`;
    }

    function aceptar() {
      document.querySelector(".galeria").style.display = "none";
      document.querySelector("video").style.display = "none";
      document.querySelector(".botones").style.display = "none";
      document.querySelector(".pregunta").style.display = "none";
      document.getElementById("final").style.display = "block";
    }
  </script>

</body>
</html>
