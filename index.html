<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>💙 Para ti 💙</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      height: 100vh;
      overflow: hidden;
    }

    /* VIDEO DE FONDO */
    video {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: -1;
    }

    /* CONTENEDOR */
    .contenedor {
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: rgba(0, 0, 0, 0.35);
      text-align: center;
      padding: 20px;
    }

    h1 {
      color: white;
      margin-bottom: 20px;
      font-size: 2rem;
    }

    button {
      padding: 15px 25px;
      margin: 10px;
      font-size: 1.1rem;
      border: none;
      border-radius: 30px;
      cursor: pointer;
    }

    #si {
      background-color: #4CAF50;
      color: white;
    }

    #no {
      background-color: #f44336;
      color: white;
    }

    #playMusic {
      background-color: #2196F3;
      color: white;
      margin-bottom: 20px;
    }

    #final {
      display: none;
      color: white;
      font-size: 1.3rem;
      margin-top: 20px;
      max-width: 500px;
    }
  </style>
</head>

<body>

  <!-- VIDEO DE FONDO -->
  <video autoplay muted loop playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>

  <!-- MUSICA -->
  <audio id="musica" loop>
    <source src="musica.mp3" type="audio/mpeg">
  </audio>

  <div class="contenedor">
    <button id="playMusic">🎵 Reproducir música</button>

    <h1 id="pregunta">¿Quieres estar conmigo siempre? 💙</h1>

    <div>
      <button id="si">Sí 💙</button>
      <button id="no">No 😢</button>
    </div>

    <div id="final">
      💙✨<br><br>
      Te amo con todo mi corazón.<br>
      Gracias por tanto, cuenta siempre conmigo y con este amor infinito que siento por ti.<br>
      Este mes es especial… como todos los meses a tu lado.
      <br><br>🪷💙✨
    </div>
  </div>

  <script>
    const btnNo = document.getElementById("no");
    const btnSi = document.getElementById("si");
    const pregunta = document.getElementById("pregunta");
    const final = document.getElementById("final");
    const musica = document.getElementById("musica");
    const playMusic = document.getElementById("playMusic");

    let frases = [
      "di que sí xfiii 🥺",
      "amoooorrr 💙",
      "say yes yes 😘",
      "gordita hermosa 💕",
      "te regalo un abrazo si dices que sí 🤍",
      "por más jumbos juntitos 🍔💙",
      "por más heladitos juntos 🍦💙",
      "por más besitos juntos 💋💙",
      "por más risas compartidas ✨",
      "por más abrazos infinitos 🤍",
      "porque contigo todo es mejor 💙",
      "solo di que sí y ya 🥺💫"
    ];

    btnNo.addEventListener("click", () => {
      const random = Math.floor(Math.random() * frases.length);
      btnNo.textContent = frases[random];
      btnSi.style.fontSize = 
        (parseFloat(getComputedStyle(btnSi).fontSize) + 5) + "px";
    });

    btnSi.addEventListener("click", () => {
      pregunta.style.display = "none";
      btnNo.style.display = "none";
      btnSi.style.display = "none";
      playMusic.style.display = "none";
      final.style.display = "block";
    });

    playMusic.addEventListener("click", () => {
      musica.play();
      playMusic.style.display = "none";
    });
  </script>

</body>
</html>
