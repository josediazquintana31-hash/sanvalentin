<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Natilla 💙</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
}

body{
  font-family:Arial, sans-serif;
  height:100vh;
  overflow-x:hidden;
}

/* VIDEO FONDO */
.video-bg{
  position:fixed;
  top:0;
  left:0;
  width:100%;
  height:100%;
  z-index:-1;
  overflow:hidden;
}

.video-bg video{
  width:100%;
  height:100%;
  object-fit:cover;
}

/* CAPA OSCURA PARA LEGIBILIDAD */
.overlay{
  background:rgba(0,0,0,0.35);
  min-height:100vh;
  text-align:center;
  color:white;
  padding-bottom:40px;
}

h1{
  margin:20px;
  color:#cce7ff;
}

.galeria{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  padding:15px;
}

.galeria img{
  width:100%;
  border-radius:15px;
  box-shadow:0 4px 10px rgba(0,0,0,.3);
}

.pregunta{
  font-size:22px;
  margin:20px;
  font-weight:bold;
}

.botones{
  position:relative;
  height:140px;
}

button{
  padding:15px 25px;
  font-size:18px;
  border:none;
  border-radius:30px;
  cursor:pointer;
}

#si{
  background:#63b3ed;
  color:white;
  transition:transform .3s;
}

#no{
  background:#a0aec0;
  color:white;
  position:absolute;
  top:60px;
  left:50%;
  transform:translateX(-50%);
}

.mensaje-final{
  display:none;
  padding:30px;
  font-size:18px;
  line-height:1.6;
}
</style>
</head>

<body>

<!-- VIDEO DE FONDO -->
<div class="video-bg">
  <video autoplay loop muted playsinline>
    <source src="video.mp4" type="video/mp4">
  </video>
</div>

<!-- CONTENIDO -->
<div class="overlay">

  <h1>Natilla 💙</h1>

  <div class="galeria">
    <img src="fotos/nos1.jpg">
    <img src="fotos/nos2.jpg">
    <img src="fotos/nos3.jpg">
    <img src="fotos/nos4.jpg">
    <img src="fotos/nos5.jpg">
    <img src="fotos/nos6.jpg">
    <img src="fotos/pochacco1.jpg">
    <img src="fotos/pochacco2.jpg">
    <img src="fotos/pochacco3.jpg">
    <img src="fotos/pochacco4.jpg">
    <img src="fotos/pochacco5.jpg">
  </div>

  <div class="pregunta">
    ¿Gordita hermosa, quieres ser mi San Valentín? 💙✨
  </div>

  <div class="botones">
    <button id="si" onclick="aceptar()">SÍ 💙</button>
    <button id="no" onmouseover="moverNo()">NO 😅</button>
  </div>

  <div class="mensaje-final" id="final">
    💙✨<br><br>
    Te amo con todo mi corazón.<br>
    Gracias por tanto, cuenta siempre conmigo.<br>
    Este mes es especial,<br>
    como todos los meses a tu lado.<br><br>
    💙✨
  </div>

</div>

<script>
let escala=1;
let frases=[
"di que sí xfiii 🥺",
"amoooorrr 💙",
"say yes yes 😘",
"gordita hermosa 💕",
"te regalo un abrazo si dices que sí 🤍"
];
let i=0;

function moverNo(){
let no=document.getElementById("no");
no.style.top=Math.random()*80+"px";
no.style.left=Math.random()*80+"px";
document.querySelector(".pregunta").innerText=frases[i%frases.length];
i++;
escala+=0.15;
document.getElementById("si").style.transform=`scale(${escala})`;
}

function aceptar(){
document.querySelector(".galeria").style.display="none";
document.querySelector(".botones").style.display="none";
document.querySelector(".pregunta").style.display="none";
document.getElementById("final").style.display="block";
}
</script>

</body>
</html>
